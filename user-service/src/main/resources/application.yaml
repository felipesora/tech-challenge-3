spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USERNAME:fiap_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS app;
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: app
        format_sql: true
    show-sql: false